name: Build Windows EXE and Android APK

"on":
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the Windows build as a GitHub release (direct download link)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Windows project files
        run: flutter create --platforms=windows .

      - name: Get dependencies
        run: flutter pub get

      # Only real errors fail the build; style hints and warnings do not.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "print_color_app-windows.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: print_color_app-windows.zip

  release-windows:
    name: Publish release
    needs: build-windows
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            print_color_app-windows.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Print Color App (Windows) build ${{ github.run_number }}" \
            --notes "Windows build from commit ${{ github.sha }}. Unzip and run print_color_app.exe." \
            --prerelease


  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
